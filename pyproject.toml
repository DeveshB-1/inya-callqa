[project]
name = "inya-callqa"
version = "0.1.0"
description = "Read-only MCP server and CLI that audits Gnani Inya voice-agent calls for code-mixed failure modes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "mcp>=2.3,<3"]

[project.scripts]
inya-callqa = "inya_callqa.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
